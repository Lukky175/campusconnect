name: CampusConnect CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  docker:
    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------
      # Checkout
      # --------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------
      # Docker Hub login
      # --------------------------------

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------
      # Generate image tag
      # --------------------------------

      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"


      # --------------------------------
      # Build backend
      # --------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/campusconnect-backend:${{ steps.image.outputs.tag }} \
            ./backend


      # --------------------------------
      # Build frontend
      # --------------------------------

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/campusconnect-frontend:${{ steps.image.outputs.tag }} \
            ./frontend


      # --------------------------------
      # Push backend
      # --------------------------------

      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/campusconnect-backend:${{ steps.image.outputs.tag }}


      # --------------------------------
      # Push frontend
      # --------------------------------

      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/campusconnect-frontend:${{ steps.image.outputs.tag }}