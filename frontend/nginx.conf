server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    location = /sitemap.xml {
        proxy_pass http://backend:5000/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:avif|css|js|mjs|jpg|jpeg|png|webp|svg|woff2|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ ^/(login|register|dashboard)(/|$) {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri $uri/ /index.html;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:5000/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
